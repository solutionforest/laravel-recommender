name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:4.*" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: composer analyse

  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '11.*', testbench: '9.*', pest: '3.*' }
          - { php: '8.4', laravel: '11.*', testbench: '9.*', pest: '3.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', pest: '3.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', pest: '3.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', pest: '4.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', pest: '4.*' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / SQLite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest

  mysql:
    runs-on: ubuntu-latest
    name: PHP 8.4 / Laravel 13 / MySQL 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: rec_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:4.*" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
        env:
          RECOMMENDER_TEST_DB: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: rec_test
          DB_USERNAME: root
