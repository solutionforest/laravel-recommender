name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:4.*" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: composer analyse

  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '10.*', testbench: '8.*', pest: '2.*' }
          - { php: '8.4', laravel: '10.*', testbench: '8.*', pest: '2.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*', pest: '3.*' }
          - { php: '8.4', laravel: '11.*', testbench: '9.*', pest: '3.*' }
          - { php: '8.5', laravel: '11.*', testbench: '9.*', pest: '3.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', pest: '3.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', pest: '3.*' }
          - { php: '8.5', laravel: '12.*', testbench: '10.*', pest: '3.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', pest: '4.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', pest: '4.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*', pest: '4.*' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / SQLite
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: |
          composer config audit.block-insecure false
          # larastan has no Laravel 10 release; it is only needed by the PHPStan job
          if [ "${{ matrix.laravel }}" = "10.*" ]; then composer remove --dev larastan/larastan phpstan/phpstan --no-update --no-interaction; fi
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest

  mysql:
    runs-on: ubuntu-latest
    name: PHP 8.4 / Laravel 13 / MySQL 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: rec_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:4.*" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
        env:
          RECOMMENDER_TEST_DB: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: rec_test
          DB_USERNAME: root

  redis:
    runs-on: ubuntu-latest
    name: PHP 8.4 / Laravel 13 / Redis cache
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, redis
          coverage: none
      - run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "pestphp/pest:4.*" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
        env:
          RECOMMENDER_TEST_CACHE: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  # Laravel 10's test stack (Testbench 8 / Pest 2 / paratest) has no PHP 8.5
  # release, so the suite cannot run there. This checks that the package
  # installs with Laravel 10 on PHP 8.5 and that every class loads cleanly.
  laravel10-php85:
    runs-on: ubuntu-latest
    name: PHP 8.5 / Laravel 10 / install + load
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: |
          composer config audit.block-insecure false
          # the dev tools (larastan, Testbench, Pest) have no Laravel 10 + PHP 8.5 release
          composer remove --dev larastan/larastan phpstan/phpstan orchestra/testbench pestphp/pest --no-update --no-interaction
          composer require "laravel/framework:10.*" --no-update --no-interaction
          composer update --no-dev --prefer-dist --no-interaction --no-progress
      - run: |
          php -d error_reporting=-1 -d display_errors=1 -r '
            set_error_handler(function ($no, $msg, $file, $line) { if (! str_contains($file, "/src/")) { return false; } fwrite(STDERR, "$msg in $file:$line\n"); exit(1); });
            require "vendor/autoload.php";
            $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("src"));
            $n = 0;
            foreach ($it as $f) {
                if ($f->getExtension() !== "php" || $f->getFilename() === "helpers.php") { continue; } // autoloaded as a file
                $class = "SolutionForest\\Recommender\\".str_replace(["src/", "/", ".php"], ["", "\\", ""], $f->getPathname());
                if (! class_exists($class) && ! interface_exists($class) && ! trait_exists($class) && ! enum_exists($class)) { fwrite(STDERR, "cannot load $class\n"); exit(1); }
                $n++;
            }
            echo "loaded $n classes with Laravel ".Illuminate\Foundation\Application::VERSION." on PHP ".PHP_VERSION."\n";
          '
